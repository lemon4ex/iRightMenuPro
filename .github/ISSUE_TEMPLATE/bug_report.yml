name: Bug 报告 / Bug Report
description: 报告一个 Bug | Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清晰描述你遇到的问题 | Describe the problem
      placeholder: 描述问题...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重现步骤 / Steps to Reproduce
      description: 详细列出重现该问题的步骤 | List the steps that reproduce it
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
      description: 你期望发生什么 | What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual Behavior
      description: 实际发生了什么 | What actually happened
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本 / macOS Version
      description: "系统设置 → 通用 → 关于 | System Settings → General → About"
      placeholder: "例如 / e.g. macOS 26.0"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: iRightMenu Pro 版本 / App Version
      description: "iRightMenu Pro 的设置 → 关于 | Settings → About in iRightMenu Pro"
      placeholder: "例如 / e.g. 2.7.0 (51)"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: 安装来源 / Installed From
      description: 官网版和 App Store 版功能不同 | The website and App Store versions differ in features
      options:
        - 官网 / Website
        - App Store
    validations:
      required: true

  - type: dropdown
    id: processor
    attributes:
      label: 处理器 / Processor
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志文件 / Log Files
      description: "设置 → 诊断 → 打开日志文件夹，粘贴相关日志内容 | Settings → Diagnostics → Open Log Folder, then paste the relevant lines"
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏 / Screenshots
      description: 拖拽图片或录屏到此处上传 | Drag images or recordings here
    validations:
      required: false
